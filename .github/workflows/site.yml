# Publishes the site to GitHub Pages. Nothing here costs money: public repositories get
# unlimited Actions minutes and free Pages.
#
# The Technical page (encrypted) is built and pushed from your PC via PUBLISH.bat. This
# workflow just assembles and deploys whatever is on main - there is no separate data fetch.

name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: trilens-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets data _site/
          rm -f _site/data/technical/bundle.local.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
