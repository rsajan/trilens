# Refreshes market data on GitHub's free servers and publishes the site to GitHub Pages.
# Nothing here costs money: public repositories get unlimited Actions minutes and free Pages.
#
# Data lives on a separate branch called "data" that is overwritten every run, so the
# repository never grows. The Technical page (encrypted) is pushed from your PC to main.

name: Refresh data and publish

on:
  schedule:
    - cron: '*/30 3-10,13-21 * * 1-5'   # prices, every 30 minutes while India and US markets are open (UTC)
    - cron: '10 */3 * * *'              # SEC filings and news, every 3 hours
    - cron: '40 */2 * * *'              # crowd sentiment, every 2 hours
    - cron: '20 1,13 * * *'             # company fundamentals, twice a day
  push:
    branches: [main]                    # a push from your PC (new Technical page, new code) republishes the site
  workflow_dispatch:
    inputs:
      jobs:
        description: 'What to refresh: all, prices, daily, filings, social, or none'
        default: 'all'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trilens-site
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      jobs: ${{ steps.pick.outputs.jobs }}
    steps:
      - uses: actions/checkout@v4

      - name: Choose what to refresh
        id: pick
        env:
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.jobs }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            case "$SCHEDULE" in
              '*/30 3-10,13-21 * * 1-5') J=prices ;;
              '10 */3 * * *') J=filings ;;
              '40 */2 * * *') J=social ;;
              '20 1,13 * * *') J=daily ;;
              *) J=prices ;;
            esac
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            J="${INPUT:-all}"
          else
            J=none
          fi
          echo "jobs=$J" >> "$GITHUB_OUTPUT"
          echo "Refreshing: $J"

      - name: Bring in the latest saved data
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            rm -rf data/fundamentals data/sentiment data/market.json data/meta.json
            git checkout FETCH_HEAD -- data
            git reset -q
            echo "Loaded the saved data branch"
          else
            echo "No data branch yet; starting from the sample data"
          fi

      - uses: actions/setup-python@v5
        if: steps.pick.outputs.jobs != 'none'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        if: steps.pick.outputs.jobs != 'none'
        run: pip install -r pipeline/requirements.txt

      - name: Fetch data
        if: steps.pick.outputs.jobs != 'none'
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: python -m pipeline.run --jobs "${{ steps.pick.outputs.jobs }}" || echo "Some jobs failed; the site keeps the last good data."

      - name: Save data to the data branch
        if: steps.pick.outputs.jobs != 'none'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          mkdir -p "$tmp/data"
          rsync -a --exclude technical data/ "$tmp/data/"
          cd "$tmp"
          git init -q -b data
          git config user.name "trilens-bot"
          git config user.email "trilens-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js assets data _site/
          rm -f _site/data/technical/bundle.local.json
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
