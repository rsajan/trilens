<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trilens — fundamentals, technicals and sentiment</title>
<meta name="description" content="A free personal market desk: company fundamentals and insider activity, your scanner and backtest results, and social sentiment, in one place.">
<meta name="theme-color" content="#0d1b2a">
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="preload" href="assets/fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/plex-400.woff2" as="font" type="font/woff2" crossorigin>
<script>
  // Set the theme before first paint so there is no flash.
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('trilens:theme') || '"auto"');
      var t = p === 'auto' || !p ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
      document.documentElement.setAttribute('data-theme', t);
      document.querySelector('meta[name=theme-color]').setAttribute('content', t === 'light' ? '#edf1f5' : '#0d1b2a');
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Trilens home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="11" cy="12" r="8" fill="none" stroke="var(--s1)" stroke-width="2.4"/><circle cx="21" cy="12" r="8" fill="none" stroke="var(--accent)" stroke-width="2.4"/><circle cx="16" cy="21" r="8" fill="none" stroke="var(--gain)" stroke-width="2.4"/></svg>
      Trilens
    </a>
    <span class="spacer"></span>
    <button class="status-chip" id="status" type="button" aria-label="Data status"><i></i><span id="status-text">Loading…</span></button>
    <button class="icon-btn" id="refresh" type="button" aria-label="Reload data" title="Reload data"></button>
    <button class="icon-btn" id="theme" type="button" aria-label="Switch theme" title="Switch theme"></button>
  </header>
  <main class="main" id="view" tabindex="-1" aria-live="polite"></main>
  <nav class="nav" aria-label="Sections" id="nav"></nav>
</div>
<noscript><p style="padding:24px;font-family:sans-serif">Trilens needs JavaScript to draw its charts and tables.</p></noscript>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
